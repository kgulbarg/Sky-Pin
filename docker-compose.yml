services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      BACKEND_PORT: 3000
    ports:
      - "${BACKEND_PORT:-5000}:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/skypin-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT:-5000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped